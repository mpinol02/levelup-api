
# Conexion con MySQL en produccion.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Valida la estructura existente de MySQL.
spring.jpa.hibernate.ddl-auto=validate

# Permite inicializar el catalogo mediante una variable de entorno.
levelup.catalogo.inicializar=${CATALOGO_INICIALIZAR:false}
